name: Numerical and export tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run numerical and export tests
        run: python -m pytest tests -m "not gui"
      - name: Run Windows Tk callback smoke test
        if: runner.os == 'Windows'
        env:
          VIL_RUN_GUI_TESTS: '1'
        run: python -m pytest tests/test_gui.py -q
      - name: Export a synthetic example without a desktop
        run: python -m virtual_instrument_lab --headless --preset "Clean reference" --output-dir output
      - name: Preserve synthetic example exports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-example-${{ matrix.os }}-py${{ matrix.python }}
          path: output/
          if-no-files-found: error
          retention-days: 7
