name: Numerical and export tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run numerical and export tests
        run: python -m pytest tests -m "not gui"
      - name: Run Windows Tk callback smoke test
        if: runner.os == 'Windows'
        env:
          VIL_RUN_GUI_TESTS: '1'
        run: python -m pytest tests/test_gui.py -q
      - name: Export a synthetic example without a desktop
        run: python -m virtual_instrument_lab --headless --preset "Clean reference" --output-dir output
      - name: Preserve synthetic example exports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-example-${{ matrix.os }}-py${{ matrix.python }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  portable:
    name: Portable / ${{ matrix.tag }}
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            tag: windows-x64
          - os: macos-14
            architecture: arm64
            tag: macos-arm64
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install native build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build native portable archive and checksums
        run: python scripts/build_portable.py
      - name: Test extracted archive outside source and Python PATH
        run: python scripts/verify_portable.py --artifact-dir dist/artifacts
      - name: Upload tested review artifact (no Release)
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.tag }}
          path: dist/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
